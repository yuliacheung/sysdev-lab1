<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人网站</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-top: 50px;
        }
        h1 { color: #333; font-size: 2.5em; }
        .emoji { font-size: 3em; }
        ul { list-style: none; padding: 0; }
        ul li { padding: 10px 0; border-bottom: 1px solid #eee; }
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">👋</div>
        <h1>欢迎来到我的个人网站</h1>
        <p>这是使用GitHub Pages创建的静态网站。</p>
        <ul>
            <li>📝 博客文章</li>
            <li>💼 项目展示</li>
            <li>📧 联系信息</li>
        </ul>
        <p><strong>姓名：</strong>张三</p>
        <p><strong>学号：</strong>2026XXXX</p>
    </div>
    <div class="footer">
        <p>&copy; 2026 系统开发工具基础</p>
    </div>
</body>
</html>
